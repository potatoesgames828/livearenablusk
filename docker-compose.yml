# LIVE ARENA — implantação com Docker Compose (um servidor).
# 1) cp .env.example .env  e preencha os segredos (ver DEPLOYMENT.md)
# 2) docker compose up -d --build
# 3) docker compose --profile monitoring up -d   (Prometheus + Grafana, opcional)
#
# Redes: "edge" (somente o proxy é publicado) e "internal" (sem acesso externo).
# PostgreSQL e Redis NUNCA são expostos fora da rede interna.

x-app: &app
  env_file: .env
  restart: unless-stopped
  networks: [internal]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  read_only: true
  tmpfs: [/tmp]
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  environment: &appenv
    DATABASE_URL: postgresql://${POSTGRES_USER:-livearena}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-livearena}?schema=public&connection_limit=10
    REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD}@redis:6379
    NODE_ENV: production

x-build: &build
  context: .
  dockerfile: infrastructure/docker/Dockerfile
  args:
    API_INTERNAL_URL: http://api:4000
    NEXT_PUBLIC_REALTIME_URL: ${PUBLIC_REALTIME_URL:-http://localhost:8080}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-livearena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-livearena}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-livearena}']
      interval: 5s
      retries: 20
    security_opt: ['no-new-privileges:true']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF ligado: filas BullMQ sobrevivem a reinícios. noeviction é exigido pelo BullMQ.
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?defina REDIS_PASSWORD}', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction', '--maxmemory', '${REDIS_MAXMEMORY:-512mb}']
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    security_opt: ['no-new-privileges:true']

  migrate:
    build: { <<: *build, target: migrate }
    env_file: .env
    environment: *appenv
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    <<: *app
    build: { <<: *build, target: api }
    environment:
      <<: *appenv
      API_PORT: 4000
      TRUST_PROXY: 'loopback, uniquelocal'

  realtime:
    <<: *app
    build: { <<: *build, target: realtime }

  worker:
    <<: *app
    build: { <<: *build, target: worker }

  game-runner:
    <<: *app
    build: { <<: *build, target: game-runner }
    # Escale horizontalmente: cada instância assume sessões via lease no Redis.
    deploy: { replicas: ${GAME_RUNNER_REPLICAS:-2}, resources: { limits: { cpus: '2', memory: 1g } } }

  connector:
    <<: *app
    build: { <<: *build, target: connector }

  stream-manager:
    <<: *app
    build: { <<: *build, target: stream-manager }
    read_only: false
    shm_size: 1g
    volumes: [recordings:/app/recordings]
    environment:
      <<: *appenv
      INTERNAL_WEB_URL: http://web:3000
      RECORDINGS_DIR: /app/recordings
    deploy: { resources: { limits: { cpus: '4', memory: 3g } } }

  web:
    <<: *app
    build: { <<: *build, target: web }
    environment:
      <<: *appenv
      # O proxy de borda sobrescreve X-Forwarded-For (ver infrastructure/reverse-proxy/Caddyfile).
      EDGE_PROXY: 'true'

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['${HTTP_PORT:-8080}:8080', '${HTTPS_PORT:-8443}:8443']
    volumes:
      - ./infrastructure/reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    networks: [edge, internal]
    depends_on: [web, realtime, api]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks: [internal]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['127.0.0.1:3001:3000']
    networks: [internal, edge]

networks:
  edge: {}
  internal:
    internal: true

volumes:
  pgdata: {}
  redisdata: {}
  recordings: {}
  caddydata: {}

# Prometheus — coleta interna (rede "internal"). Se METRICS_TOKEN estiver
# definido nos serviços, coloque o mesmo valor em /etc/prometheus/metrics-token
# e descomente "authorization".
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: api
    metrics_path: /api/metrics
    static_configs: [{ targets: ['api:4000'] }]
    # authorization: { credentials_file: /etc/prometheus/metrics-token }
  - job_name: realtime
    static_configs: [{ targets: ['realtime:4001'] }]
  - job_name: worker
    static_configs: [{ targets: ['worker:9101'] }]
  - job_name: game-runner
    dns_sd_configs: [{ names: ['game-runner'], type: A, port: 9102 }]
  - job_name: connector
    static_configs: [{ targets: ['connector:9103'] }]
  - job_name: stream-manager
    static_configs: [{ targets: ['stream-manager:9104'] }]

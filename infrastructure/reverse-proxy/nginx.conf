# Alternativa ao Caddy (nginx). Pontos de segurança:
#  - X-Forwarded-For é SOBRESCRITO com $remote_addr (não anexado), impedindo falsificação;
#  - /metrics não é publicado;
#  - WebSocket com upgrade para o realtime.
upstream web { server web:3000; keepalive 32; }
upstream realtime { server realtime:4001; }

server {
  listen 80;
  server_name _;
  client_max_body_size 1m;

  location /socket.io/ {
    proxy_pass http://realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
  }

  location ~ ^/(api/)?metrics { return 404; }

  location / {
    proxy_pass http://web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
